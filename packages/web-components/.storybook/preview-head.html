<base href="./" />

<!-- Storybook deployed as a static site often aggressively caches, requiring a hard reload, so attempt to prevent this -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="stylesheet"  type="text/css" href="assets/css/storybook-canvas.css">

<link rel="stylesheet" type="text/css" href="assets/css/roboto.css" />
<link rel="stylesheet" type="text/css" href="assets/css/roboto_mono.css" />

<!-- Loading the CBP DS components as a module allows them to be rebuilt and watched properly -->
<!--<script type="module" src="../www/build/cbp-web-components.esm.js" /> -->

<!-- https://storybook.js.org/docs/builders/vite#interaction-tests-not-working-as-expected -->
<script>
  window.global = window;

  // in-page navigation doesn't work properly, so call this onClick instead
  function inPageNavigation(e) {
    e.preventDefault();
    document.querySelector(`[id=${e.target.dataset.id}]`).focus();
    return false;
  }
</script>
